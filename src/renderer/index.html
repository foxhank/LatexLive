<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' ws: wss: blob:; worker-src 'self' blob:;">
  <title>LiveLaTeX</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div id="titlebar-left">
        <span id="app-title">LiveLaTeX</span>
        <span id="file-path"></span>
        <span id="modified-indicator"></span>
        <span id="collab-chip" class="hidden"></span>
      </div>
      <div id="titlebar-center">
        <button id="btn-compile" title="手动编译 (Ctrl+Enter)">▶ <span class="shortcut-hint">编译</span></button>
        <button id="btn-export" title="全量编译并导出 PDF (含目录/参考文献的完整编译)">⬇ <span class="shortcut-hint">导出</span></button>
        <button id="btn-synctex" title="正反向跳转模式">⇄ <span class="shortcut-hint">跳转</span></button>
        <span id="compile-status" class="status-idle">就绪</span>
        <span id="compile-timer" class="hidden"></span>
      </div>
      <div id="titlebar-right">
        <button id="btn-collab" title="局域网多人协作">👥 <span class="shortcut-hint">协作</span></button>
        <button id="btn-settings" title="设置">⚙</button>
      </div>
    </div>
    <div id="main">
      <div id="editor-panel">
        <div id="editor-toolbar">
          <button id="btn-new" title="新建 (Ctrl+N)">📄 新建</button>
          <button id="btn-open" title="打开 (Ctrl+O)">📂 打开</button>
          <button id="btn-save" title="保存 (Ctrl+S)">💾 保存</button>
          <button id="btn-save-as" title="另存为 (Ctrl+Shift+S)">💾 另存为</button>
          <span class="toolbar-file" id="current-file"></span>
        </div>
        <div id="editor-container"></div>
        <div id="error-panel" class="hidden">
          <div id="error-header">
            <span>⚠ 编译错误</span>
            <button id="error-close">×</button>
          </div>
          <div id="error-list"></div>
        </div>
      </div>
      <div id="divider"></div>
      <div id="viewer-panel">
        <div id="viewer-toolbar">
          <button id="btn-zoom-out" title="缩小">−</button>
          <span id="zoom-level">100%</span>
          <button id="btn-zoom-in" title="放大">+</button>
          <span id="page-info">— / —</span>
          <button id="btn-fit-width" title="适应宽度">↔</button>
          <button id="btn-fit-page" title="适应页面">⊞</button>
        </div>
        <div id="viewer-container">
          <canvas id="pdf-canvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>设置</h2>
        <button class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>LaTeX 引擎</label>
          <select id="setting-engine">
            <option value="xelatex">XeLaTeX (推荐, 支持中文)</option>
            <option value="pdflatex">pdfLaTeX</option>
            <option value="lualatex">LuaLaTeX</option>
            <option value="latexmk">latexmk</option>
          </select>
        </div>
        <div class="form-group">
          <label>编译器路径 (可选)</label>
          <div class="input-with-button">
            <input type="text" id="setting-engine-path" placeholder="留空则自动探测 PATH">
            <button id="btn-browse-engine">浏览...</button>
          </div>
        </div>
        <div class="form-group">
          <label>编辑器字体</label>
          <input type="text" id="setting-editor-font" value="Consolas">
        </div>
        <div class="form-group">
          <label>字体大小</label>
          <input type="number" id="setting-editor-font-size" min="10" max="32" value="14">
        </div>
        <div class="form-group">
          <label>自动编译防抖 (毫秒)</label>
          <input type="number" id="setting-debounce" min="200" max="5000" step="100" value="800">
        </div>
        <div class="form-group">
          <label>主题</label>
          <select id="setting-theme">
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </div>
        <div class="form-group">
          <button id="btn-detect-engine" class="btn-secondary">探测系统中引擎</button>
          <span id="detect-result" class="hidden"></span>
        </div>
        <div class="form-group">
          <label>软件更新（只更新程序本身，宏包不动）</label>
          <div class="input-with-button">
            <code id="update-status" class="collab-path">当前版本</code>
            <button id="btn-check-update" class="btn-secondary">检查更新</button>
          </div>
          <button id="btn-install-update" class="btn-update-install hidden">重启并安装更新</button>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-settings-save">保存</button>
        <button id="btn-settings-cancel" class="btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <!-- Collab Modal -->
  <div id="collab-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>局域网协作</h2>
        <button id="collab-close" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>你的名字（队友会看到）</label>
          <input type="text" id="collab-name" placeholder="例如：小明" maxlength="32">
        </div>
        <div id="collab-idle-view">
          <div class="form-group">
            <label>① 创建房间（共享当前打开的文档，你是主持人）</label>
            <button id="btn-collab-host" class="btn-secondary">🏠 创建房间</button>
          </div>
          <div class="form-group">
            <label>② 加入房间 — 局域网发现的房间</label>
            <div id="collab-rooms" class="collab-rooms">
              <div class="collab-empty">正在扫描局域网…</div>
            </div>
          </div>
          <div class="form-group">
            <label>或手动加入（扫描不到时，输入主持人的 IP:端口）</label>
            <div class="input-with-button">
              <input type="text" id="collab-manual" placeholder="192.168.1.23:48712">
              <button id="btn-collab-manual">加入</button>
            </div>
          </div>
        </div>
        <div id="collab-active-view" class="hidden">
          <div class="collab-room-banner" id="collab-room-info"></div>
          <div class="form-group">
            <label>本机共享文件夹（往里放文件 = 全员同步，可把路径告诉 AI 助手）</label>
            <div class="collab-path-row">
              <code id="collab-path" class="collab-path"></code>
              <button id="btn-collab-open-dir" class="btn-secondary" title="在资源管理器中打开">📁 打开</button>
              <button id="btn-collab-copy-path" class="btn-secondary" title="复制文件夹路径">复制路径</button>
            </div>
          </div>
          <div class="form-group">
            <label>当前成员</label>
            <div id="collab-peers" class="collab-peers"></div>
          </div>
          <button id="btn-collab-leave" class="btn-secondary">退出协作（内容保留在本机）</button>
        </div>
        <div id="collab-msg" class="collab-msg"></div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
