name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download and extract TinyTeX
        shell: powershell
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/rstudio/tinytex-releases/releases/latest" -Headers @{ "User-Agent" = "latexlive-build" }
          $asset = $release.assets | Where-Object { $_.name -match "^TinyTeX-1-windows-.+\.exe$" } | Select-Object -First 1
          if (-not $asset) { throw "TinyTeX-1 windows asset not found" }
          Write-Host "Downloading $($asset.name) ($([math]::Round($asset.size / 1MB, 1)) MB)"
          curl.exe -L --retry 5 --retry-delay 5 --retry-all-errors -o "tinytex.exe" $asset.browser_download_url
          if (-not (Test-Path "tinytex.exe") -or (Get-Item "tinytex.exe").Length -lt 1MB) {
            throw "TinyTeX download failed"
          }
          Write-Host "Extracting..."
          7z x "tinytex.exe" -o"texlive" -y | Out-Null
          Remove-Item "tinytex.exe"
          if (Test-Path "texlive\TinyTeX\bin\windows\xelatex.exe") {
            Write-Host "TinyTeX extracted OK"
          } else {
            throw "TinyTeX extraction failed: xelatex.exe not found"
          }

      - name: Build app
        run: npm run build

      # Single distributable: a plain zip of win-unpacked — users extract and
      # run LiveLaTeX.exe directly, no installer. TinyTeX ships along in
      # extraResources so the app compiles out of the box.
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win zip --publish never --config .github/electron-builder/with-tex.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveLaTeX-win64
          path: release/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
