appId: com.livelatex.app
productName: LiveLaTeX
copyright: Copyright © 2025

# TinyTeX unpacks to ~600MB; default (deflate) compression brings the zip
# down to roughly 200MB, which is what users actually download.
compression: normal

# App has no native modules needing an Electron-ABI rebuild (chokidar/electron-store/
# pdfjs-dist are pure JS on Windows); skip @electron/rebuild so the unused optional
# `canvas` dep of pdfjs-dist doesn't fail to compile against missing GTK/Cairo.
npmRebuild: false

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - node_modules/**/*.js
  - node_modules/**/*.mjs
  - node_modules/**/*.json
  - "!node_modules/**/test"
  - "!node_modules/**/docs"
  - "!node_modules/**/demo"
  - "!node_modules/**/example"
  - "!node_modules/**/*.map"

extraResources:
  - from: texlive/TinyTeX
    to: texlive/TinyTeX
    filter:
      - "**/*"

asar: true
asarUnpack:
  - node_modules/chokidar/**
  - node_modules/electron-store/**
  - "**/*.node"

win:
  target:
    - target: zip
      arch:
        - x64
  artifactName: LiveLaTeX-win64-${version}.${ext}

extraMetadata:
  main: dist/main/index.js
